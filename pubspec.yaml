name: splitwise_app
description: Expense splitting app with OCR and voice input.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.5.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # OCR
  google_mlkit_text_recognition: ^0.13.0

  # Camera / Image
  image_picker: ^1.1.2
  camera: ^0.11.0+2

  # Voice / Speech
  speech_to_text: ^6.6.2

  # UI helpers
  cached_network_image: ^3.3.1
  intl: ^0.19.0

  # Utilities
  uuid: ^4.4.0
  http: ^1.2.0
  url_launcher: ^6.3.0
  share_plus: ^10.1.0
  google_fonts: ^6.2.1

  # Charts (statistics page)
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# App icon generation. Drop a 1024x1024 PNG at assets/icon/splitwise_logo.png
# (use preview/export-logo.html to generate one from the SVG mark) and run:
#   dart run flutter_launcher_icons
# This populates ios/Runner/Assets.xcassets/AppIcon.appiconset at every
# required size — no manual Xcode work.
flutter_launcher_icons:
  ios: true
  android: false
  image_path: "assets/icon/splitwise_logo.png"
  remove_alpha_ios: true   # iOS rejects icons with alpha — flatten the bg
  background_color_ios: "#0A1F18"
