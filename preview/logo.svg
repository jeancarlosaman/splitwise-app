<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- iOS-style rounded-square icon (22% corner radius, ~225 of 1024). -->
  <defs>
    <linearGradient id="mintBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Subtle inner highlight on the top edge for premium feel. -->
    <linearGradient id="topGloss" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft inner glow tucked behind the mark. -->
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="14" result="shadowOffset"/>
      <feFlood flood-color="#000000" flood-opacity="0.45"/>
      <feComposite in2="shadowOffset" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card background -->
  <rect x="0" y="0" width="1024" height="1024" rx="225" ry="225" fill="url(#mintBg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="225" ry="225" fill="url(#glow)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="225" ry="225" fill="url(#topGloss)"/>

  <!-- "S" mark formed by two interleaved half-arcs (representing two halves
       of a split bill). Drawn in deep mint for high contrast on the bright
       background. Mark sits at ~16% inset from each edge. -->
  <g transform="translate(512, 512)" fill="none" stroke="#052E1F" stroke-width="118" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top loop of the S -->
    <path d="M 200 -210
             C 200 -300, 80 -340, -40 -340
             C -180 -340, -250 -260, -240 -160
             C -230 -60, -120 -30, 0 0" />
    <!-- Bottom loop of the S -->
    <path d="M -200 210
             C -200 300, -80 340, 40 340
             C 180 340, 250 260, 240 160
             C 230 60, 120 30, 0 0" />
  </g>

  <!-- Two short divider dashes flanking the center node, reinforcing the
       "split" idea. -->
  <g transform="translate(512, 512)" fill="#052E1F">
    <circle cx="-310" cy="0" r="22"/>
    <circle cx="310" cy="0" r="22"/>
  </g>
</svg>
