workflows:
  ios-release:
    name: iOS Release (Sideloadly)
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Flutter pub get
        script: flutter pub get

      - name: Pod install
        script: |
          cd ios
          pod install --repo-update

      - name: Build unsigned iOS app
        script: |
          set +e
          flutter build ios --release --no-codesign
          BUILD_EXIT=$?
          set -e

          if [ $BUILD_EXIT -ne 0 ]; then
            echo "==== flutter build failed (exit $BUILD_EXIT) ===="
            echo "==== Recent xcodebuild logs ===="
            ls -lt /tmp/xcodebuild_logs/ 2>/dev/null | head -5 || true
            LATEST_LOG=$(ls -t /tmp/xcodebuild_logs/*.log 2>/dev/null | head -1)
            if [ -n "$LATEST_LOG" ]; then
              echo "==== Last 300 lines of $LATEST_LOG ===="
              tail -n 300 "$LATEST_LOG"
            fi
            exit $BUILD_EXIT
          fi

      - name: Package unsigned IPA for Sideloadly
        script: |
          APP_PATH=$(find build/ios/iphoneos -name "*.app" -maxdepth 3 | head -1)
          echo "Found app bundle at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found" && exit 1
          fi
          mkdir -p build/ios/ipa/Payload
          cp -r "$APP_PATH" build/ios/ipa/Payload/
          cd build/ios/ipa && zip -r splitwise_app.ipa Payload/
          echo "IPA size: $(du -sh splitwise_app.ipa)"
          cd -
          rm -rf build/ios/ipa/Payload

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - jeancarlosaman@gmail.com
        notify:
          success: true
          failure: true
