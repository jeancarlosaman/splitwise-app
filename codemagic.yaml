workflows:
  ios-release:
    name: iOS Release (Sideloadly)
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Generate iOS project files
        script: |
          # Back up our custom Info.plist
          cp ios/Runner/Info.plist /tmp/Info.plist.bak
          # Regenerate the full Xcode project structure
          flutter create --platforms=ios --project-name splitwise_app --org com.jeancarlosaman .
          # Restore custom Info.plist (camera, mic, speech permissions)
          cp /tmp/Info.plist.bak ios/Runner/Info.plist

      - name: Disable code signing in pbxproj
        script: |
          python3 << 'PYEOF'
          import re

          path = 'ios/Runner.xcodeproj/project.pbxproj'
          with open(path, 'r') as f:
              content = f.read()

          # Keys we want present in every buildSettings block so xcodebuild
          # accepts the build without a Development Team / provisioning profile.
          injected_keys = {
              'CODE_SIGNING_ALLOWED':  'NO',
              'CODE_SIGNING_REQUIRED': 'NO',
              'CODE_SIGN_IDENTITY':    '""',
              'CODE_SIGN_STYLE':       'Manual',
              'DEVELOPMENT_TEAM':      '""',
              'PROVISIONING_PROFILE_SPECIFIER': '""',
          }

          def patch_block(m):
              indent = m.group('indent')
              body = m.group('body')
              # Strip any existing occurrences of the keys we're about to set.
              for key in injected_keys:
                  body = re.sub(
                      rf'^[ \t]*{key}\s*=\s*[^;]*;\s*\n?',
                      '',
                      body,
                      flags=re.MULTILINE,
                  )
              inner_indent = indent + '\t'
              additions = ''.join(
                  f'{inner_indent}{k} = {v};\n' for k, v in injected_keys.items()
              )
              return f'{indent}buildSettings = {{\n{additions}{body}{indent}}};'

          # Match every `buildSettings = { ... };` block (non-greedy, dotall).
          pattern = re.compile(
              r'(?P<indent>[ \t]*)buildSettings = \{\n(?P<body>.*?)(?P=indent)\};',
              re.DOTALL,
          )
          patched, n = pattern.subn(patch_block, content)
          print(f'Patched {n} buildSettings block(s)')

          with open(path, 'w') as f:
              f.write(patched)

          for key in injected_keys:
              count = len(re.findall(rf'{key}\s*=', patched))
              print(f'  {key}: {count} occurrence(s)')
          PYEOF

      - name: Build iOS (no codesign — Sideloadly will sign)
        script: |
          flutter build ios --release --no-codesign

          APP_PATH=$(find build/ios/iphoneos -name "*.app" -maxdepth 3 | head -1)
          echo "Found app bundle at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found" && exit 1
          fi
          mkdir -p build/ios/ipa/Payload
          cp -r "$APP_PATH" build/ios/ipa/Payload/
          cd build/ios/ipa && zip -r splitwise_app.ipa Payload/
          echo "IPA size: $(du -sh splitwise_app.ipa)"
          cd -
          rm -rf build/ios/ipa/Payload

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - jeancarlosaman@gmail.com
        notify:
          success: true
          failure: true
