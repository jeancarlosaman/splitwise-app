workflows:
  ios-release:
    name: iOS Release (Sideloadly)
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Generate iOS project files
        script: |
          # Back up our custom Info.plist
          cp ios/Runner/Info.plist /tmp/Info.plist.bak
          # Generate the full Xcode project structure (xcodeproj, xcworkspace, AppDelegate, etc.)
          flutter create --platforms=ios --project-name splitwise_app --org com.jeancarlosaman .
          # Restore our custom Info.plist (camera, mic, speech permissions)
          cp /tmp/Info.plist.bak ios/Runner/Info.plist

      - name: Build iOS (no codesign — Sideloadly will sign)
        script: |
          # Flutter requires a non-empty DEVELOPMENT_TEAM even with --no-codesign.
          # Patch the pbxproj with a dummy team so the preflight check passes.
          sed -i '' 's/DEVELOPMENT_TEAM = "";/DEVELOPMENT_TEAM = FAKETEAM00;/g' \
            ios/Runner.xcodeproj/project.pbxproj
          echo "Team entries after patch:"
          grep DEVELOPMENT_TEAM ios/Runner.xcodeproj/project.pbxproj | sort -u

          # Build — --no-codesign tells Xcode to skip actual signing
          flutter build ios --release --no-codesign

          # Package .app into IPA for Sideloadly
          APP_PATH=$(find build/ios/iphoneos -name "*.app" -maxdepth 3 | head -1)
          echo "Found app bundle at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found" && exit 1
          fi
          mkdir -p build/ios/ipa/Payload
          cp -r "$APP_PATH" build/ios/ipa/Payload/
          cd build/ios/ipa && zip -r splitwise_app.ipa Payload/
          echo "IPA size: $(du -sh splitwise_app.ipa)"
          cd -
          rm -rf build/ios/ipa/Payload

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - jeancarlosaman@gmail.com
        notify:
          success: true
          failure: true
